name: myapprun
description: "Modo Iraq E-commerce App"
publish_to: 'none'
version: 1.7.3+44

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0 # 👈 أضف هذا السطر
  connectivity_plus: ^7.3.1

  flutter_web_plugins: # 👈 أضف هذا السطر هنا
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.5.3
  shared_preferences: ^2.2.3
  flutter_staggered_grid_view: ^0.7.0
  video_player: ^2.8.6
  url_launcher: ^6.3.1
  intl: ^0.20.2
  uuid: ^4.5.2
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  firebase_messaging: ^16.0.4
  facebook_app_events: ^0.28.0
  device_preview: ^1.2.0
  tiktok_events_sdk: ^1.3.0
  cached_network_image: ^4.0.0
  path_provider: ^2.1.6
  flutter_cache_manager: ^3.4.5
  app_links: ^7.2.1
  app_tracking_transparency: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.14.4 # تم نقلها هنا لتنظيم الكود
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

# === إعدادات أيقونة التطبيق (Modo App Icon) ===
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/logomodo.png" # مسار اللوكو البرتقالي الجديد
  min_sdk_android: 21

# === إعدادات الشاشة الافتتاحية (Modo Splash Screen) ===
flutter_native_splash:
  color: "#ffffff" # خلفية بيضاء لتتناسب مع ألوان modo
  image: assets/icons/logomodo.png # لوكو modo البرتقالي في المنتصف
  android: true
  ios: true